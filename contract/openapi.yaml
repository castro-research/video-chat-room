openapi: 3.0.3
info:
  title: Kurz server contract
  version: 0.4.0
  description: |
    The contract every Kurz server implements, whatever language it is written in. One server is a platform: accounts are global, and users create and join many guilds (communities).
    The client is given a base URL and talks only to what is described here. Draft: 0.x may still break between minors.

    REST is described by `paths`. The two WebSocket channels (`/v1/gateway`, `/v1/media`) are described by their message
    schemas under `components.schemas` (`Gateway*`, `Media*`); the flows are in README.md.

    Conventions
    - Every path is relative to the base URL the user typed (`https://tenant.example.com`, or with a path prefix).
    - Ids are opaque strings. Timestamps are RFC 3339 UTC.
    - Errors are `ApiError`. `code` is an open set: clients treat unknown codes as a generic failure of that status.
      Known codes: unauthorized, token_expired, forbidden, not_found, validation, username_taken, registration_closed,
      invalid_invite, rate_limited, not_supported, missing_permission, hierarchy, invite_expired, banned, owner_cannot_leave.
    - A guild, or a channel, the caller is not a member of (or cannot see) answers 404 `not_found`, never revealing it exists.
    - Authorization is checked by the server on every operation. `missing_permission` (403): the caller lacks the permission bit.
      `hierarchy` (403): the target's highest role is not below the caller's. The guild owner skips both.
    - 0.2 describes REST only for guilds; the guild-scoped gateway events arrive with the gateway itself.
    - 0.3 adds message editing/deleting/replies, reactions and read states over REST. Messages exist only in `text` channels (422 `validation` elsewhere).
    - 0.4 specifies the gateway: sequence numbers, resume, permission-filtered events. Frames and events are in `gateway.md`; the `Gateway*` schemas below are the pre-0.4 shapes and are superseded by it where they differ. New capability `realtime`.
    - Authenticated calls send `Authorization: Bearer <accessToken>`. On 401 `token_expired` the client refreshes once and retries.
    - 429 carries `Retry-After` (seconds).
    - An endpoint that belongs to a capability the server does not advertise answers 501 `not_supported`.
servers:
  - url: '{base}'
    description: The base URL typed into the client.
    variables:
      base:
        default: http://localhost:8080
security:
  - bearer: []

paths:
  /.well-known/kurz:
    get:
      operationId: getServerInfo
      tags: [discovery]
      security: []
      summary: Identify the server, its contract version and what it supports. Public.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }

  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      security: []
      summary: Create an account (when `registration` is open, or invite with a valid `inviteCode`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: username_taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Exchange username and password for a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      security: []
      summary: Rotate the refresh token and get a new access token. The old refresh token stops working.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Revoked }

  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: The authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMe
      tags: [me]
      summary: Change own display name, custom status or avatar hue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds:
    get:
      operationId: listMyGuilds
      tags: [guilds]
      summary: The guilds the caller is a member of
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuildList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createGuild
      tags: [guilds]
      summary: Create a guild. The caller becomes the owner; it starts with the @everyone role and a text channel `geral`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGuildRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds/{guildId}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: getGuild
      tags: [guilds]
      summary: One guild. Members only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteGuild
      tags: [guilds]
      summary: Delete the guild with everything in it. Owner only (403 `forbidden` for other members).
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/guilds/{guildId}/owner:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    put:
      operationId: transferGuildOwnership
      tags: [guilds]
      summary: Hand the guild to another member. Owner only. The previous owner becomes a regular member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnershipRequest' }
      responses:
        '204': { description: Transferred }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds/{guildId}/members:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: listGuildMembers
      tags: [members]
      summary: Members ordered by user id, with their role ids
      parameters:
        - name: after
          in: query
          description: The `next` of the previous page.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/guilds/{guildId}/members/@me:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    delete:
      operationId: leaveGuild
      tags: [members]
      summary: Leave the guild. The owner cannot (409 `owner_cannot_leave`).
      responses:
        '204': { description: Left }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/guilds/{guildId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: kickMember
      tags: [members]
      summary: Kick a member (they can rejoin with an invite). Needs `kickMembers`; the target must be below the caller.
      responses:
        '204': { description: Kicked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds/{guildId}/members/{userId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/RoleId'
    put:
      operationId: addMemberRole
      tags: [members]
      summary: Give a role to a member. Needs `manageRoles`; the role and the member must be below the caller. Idempotent.
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: removeMemberRole
      tags: [members]
      summary: Take a role from a member. Same rules as giving it.
      responses:
        '204': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds/{guildId}/bans:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: listBans
      tags: [bans]
      summary: Banned users. Needs `banMembers`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/guilds/{guildId}/bans/{userId}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: banUser
      tags: [bans]
      summary: Ban a user, member or not. Removes them from the guild; joining by invite answers 403 `banned` until unbanned.
      description: Needs `banMembers`; a member target must be below the caller. Banning again updates the reason. The body is optional.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BanRequest' }
      responses:
        '204': { description: Banned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: unbanUser
      tags: [bans]
      summary: Lift a ban. Needs `banMembers`. 404 if the user is not banned.
      responses:
        '204': { description: Unbanned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/guilds/{guildId}/roles:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: listRoles
      tags: [roles]
      summary: Roles by position, ascending. `@everyone` (position 0, id = guild id) is always first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role at position 1 (just above @everyone). Needs `manageRoles`; the caller can only grant bits they have.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds/{guildId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
      - $ref: '#/components/parameters/RoleId'
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Rename, change permissions or move a role. Needs `manageRoles`; the role must be below the caller, and after a move still is.
      description: '`@everyone` can only have its permissions changed. Newly added bits must be ones the caller has.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a role (members lose it). Needs `manageRoles`; the role must be below the caller. Not @everyone.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds/{guildId}/invites:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: listInvites
      tags: [invites]
      summary: The guild's invites. Needs `createInvite`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invite code, optionally expiring and limited in uses. Needs `createInvite`. The body is optional.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/invites/{code}:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    get:
      operationId: previewInvite
      tags: [invites]
      summary: Which guild an invite leads to, without joining.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: invalid_invite, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '410': { description: invite_expired (time passed or all uses spent), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Delete an invite. Its creator, or an Administrator.
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invites/{code}/join:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    post:
      operationId: joinGuild
      tags: [invites]
      summary: Join the guild an invite leads to. Joining a guild you are already in succeeds and spends no use.
      responses:
        '200':
          description: Joined (or already a member)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: banned, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: invalid_invite, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '410': { description: invite_expired, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/guilds/{guildId}/channels:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: listChannels
      tags: [channels]
      summary: The channels the caller can see (`viewChannel`), flat. Group by `parentId`, order by `position`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a text or voice channel, or a category, at the end of its group. Needs `manageChannels` in the guild.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChannelRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: getChannel
      tags: [channels]
      summary: One channel. 404 when the caller cannot see it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Rename, move to another category (`parentId`, null for none) and/or reorder inside the group (`position`, 0-based). Needs `manageChannels` in the channel, and in the target category.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChannelRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete a channel. Deleting a category frees its channels (they lose the `parentId`). Needs `manageChannels` in the channel.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channels/{channelId}/overrides:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: listChannelOverrides
      tags: [channels]
      summary: Permission overrides of the channel. Needs `manageChannels` in the channel.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channels/{channelId}/overrides/{kind}/{targetId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [role, member] }
      - name: targetId
        in: path
        required: true
        description: A role id (`@everyone` is the guild id) or a user id.
        schema: { type: string }
    put:
      operationId: setChannelOverride
      tags: [channels]
      summary: Set the allow/deny bits of a role or member in this channel. Both zero removes the override.
      description: |
        Needs `manageChannels` in the channel. A role target must be below the caller (`@everyone` always can be edited);
        a member target must be below the caller, or be the caller. `allow` can only hold bits the caller has in the channel.
        `administrator` cannot appear in an override, and a bit cannot be both allowed and denied.

        Resolution for a member: base permissions (@everyone + roles), then the @everyone override, then the union of the
        deny and allow of their roles' overrides, then the member's own override. Owner and Administrator skip it all.
        Without `viewChannel` the member has nothing in the channel; without `connect` there is no `speak`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: deleteChannelOverride
      tags: [channels]
      summary: Remove an override. Same rules as setting it.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channels/{channelId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: listMessages
      tags: [messages]
      summary: One page of history, always oldest to newest
      description: |
        Cursor pagination on message ids, which grow with time. At most one of `before`, `after` and `around`.
        - none: the newest `limit` messages.
        - `before`: the newest `limit` messages older than the cursor (cursor excluded).
        - `after`: the oldest `limit` messages newer than the cursor (cursor excluded).
        - `around`: about half of `limit` older than the cursor, the rest from the cursor on (cursor included if it still exists).
        The cursor need not exist anymore (deleted messages).
      parameters:
        - name: before
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string }
        - name: around
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Post a message. It is also pushed to everyone (sender included) as `message.create`.
      description: Needs `sendMessages` in the channel. `replyToId` must be a message of the same channel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/channels/{channelId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
    patch:
      operationId: editMessage
      tags: [messages]
      summary: Edit a message. Only its author can (403 `forbidden` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditMessageRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message. The author can; anyone else needs `manageMessages` (403 `missing_permission`).
      description: Deletion is permanent. Its reactions go with it, and replies to it lose `replyToId`.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channels/{channelId}/messages/{messageId}/reactions/{emoji}/@me:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/Emoji'
    put:
      operationId: addReaction
      tags: [messages]
      summary: React with an emoji. Idempotent. Needs `sendMessages`.
      description: A message takes at most 20 different emojis (422 `validation`).
      responses:
        '204': { description: Reacted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/channels/{channelId}/messages/{messageId}/reactions/{emoji}/{userId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/Emoji'
      - name: userId
        in: path
        required: true
        description: '`@me` removes the caller''s own reaction. Another user''s needs `manageMessages`.'
        schema: { type: string }
    delete:
      operationId: removeReaction
      tags: [messages]
      summary: Remove a reaction. Idempotent.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channels/{channelId}/read:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: getChannelReadState
      tags: [messages]
      summary: The caller's read state in the channel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: markRead
      tags: [messages]
      summary: Mark the channel as read up to a message of that channel. Never moves backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '204': { description: Marked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/guilds/{guildId}/read:
    get:
      operationId: getGuildReadStates
      tags: [messages]
      summary: The caller's read state in every text channel of the guild they can see
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReadState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/uploads:
    post:
      operationId: upload
      tags: [messages]
      summary: Upload a file to attach to a message (capability `attachments`)
      description: The returned id goes in `SendMessageRequest.attachmentIds`. Servers may discard uploads never attached.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
        '501': { description: not_supported }

  /v1/channels/{channelId}/voice/join:
    post:
      operationId: joinVoice
      tags: [voice]
      summary: Get what is needed to connect to a voice channel's media. Leaves any other voice channel first.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '501': { description: not_supported }

  /v1/channels/{channelId}/voice/leave:
    post:
      operationId: leaveVoice
      tags: [voice]
      summary: Leave the voice channel. Closing the media socket has the same effect.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { description: Left }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/gateway:
    get:
      operationId: gateway
      tags: [realtime]
      security: []
      summary: WebSocket for realtime events (no token in the URL; the first frame authenticates)
      description: |
        Upgrade to WebSocket. Frames are JSON `{ "op": string, "t"?: string, "seq"?: integer, "d"?: object }`.
        The full protocol (handshake, heartbeat, `seq`, resume, event list, filtering, close codes) is in `gateway.md`.
        Summary: the server sends `hello`; the client sends `identify` (or `resume`) with the access token within 10 s;
        the server answers `ready` (session id and the user's guilds) and then `dispatch` frames `{ op, t, seq, d }`
        with a per-session `seq`. Events are filtered by permission. Close 4001 = bad or expired token.
        Liveness is the client `heartbeat` op; 2 intervals of silence close with 4010.
      responses:
        '101': { description: Switching Protocols }

  /v1/media:
    get:
      operationId: media
      tags: [realtime]
      security: []
      summary: WebSocket for WebRTC signaling with the SFU. Default value of `VoiceSession.media.url`; may be another host.
      description: |
        Frames are JSON `{ "op": string, "d": object }`. Client to server: `MediaClientMessage`. Server to client: `MediaServerMessage`.
        The first client frame must be `join` within 10 s, else the server closes with 4001.
        Closing the socket leaves the voice channel.
      responses:
        '101': { description: Switching Protocols }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `accessToken` of a `Session`. Opaque to the client.

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string }
    GuildId:
      name: guildId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
    InviteCode:
      name: code
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    Emoji:
      name: emoji
      in: path
      required: true
      description: URL-encoded emoji (or short name). 1-64 bytes, no whitespace or control characters.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Unauthorized:
      description: unauthorized or token_expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: forbidden, missing_permission or hierarchy (or registration_closed / invalid_invite on register)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: not_found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Validation:
      description: validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: conflict (owner_cannot_leave)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: rate_limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    # ---------- shared ----------
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string, description: 'Human readable, not for matching.' }

    Status:
      type: string
      description: offline is derived by the server when the user has no open gateway connection.
      enum: [online, idle, offline]

    ServerInfo:
      type: object
      required: [contract, name, registration, capabilities]
      properties:
        contract:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: major.minor of this contract. A client refuses a server whose major differs.
          example: '0.4'
        name: { type: string }
        hue: { type: number, minimum: 0, maximum: 360, description: Color of the generated icon when there is no `iconUrl`. }
        iconUrl: { type: string, format: uri }
        registration:
          type: string
          enum: [open, invite, closed]
        capabilities:
          type: array
          description: '`text` is mandatory. The others are optional, and absent ones never show up in channels or responses.'
          items:
            type: string
            enum: [text, realtime, voice, video, screenshare, attachments]

    User:
      type: object
      required: [id, username, name, status]
      properties:
        id: { type: string }
        username: { type: string, description: 'Unique, lowercase [a-z0-9_]{3,32}.' }
        name: { type: string, minLength: 1, maxLength: 64, description: Display name. }
        status: { $ref: '#/components/schemas/Status' }
        subtitle: { type: string, maxLength: 128, description: Custom status line. }
        hue: { type: number, minimum: 0, maximum: 360, description: Color of the generated avatar when there is no `avatarUrl`. }
        avatarUrl: { type: string, format: uri }

    # ---------- auth / me ----------
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 64, description: Defaults to the username. }
        inviteCode: { type: string, description: Required when `registration` is invite. }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconds until `accessToken` expires. }
        user: { $ref: '#/components/schemas/User' }

    UpdateMeRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        subtitle: { type: string, maxLength: 128, description: Empty string clears it. }
        hue: { type: number, minimum: 0, maximum: 360 }

    # ---------- guilds ----------
    Permissions:
      type: integer
      format: int64
      description: |
        Bitmask. 1 viewChannel, 2 sendMessages, 4 manageMessages, 8 manageChannels, 16 createInvite, 32 kickMembers,
        64 banMembers, 128 connect, 256 speak, 512 manageRoles, 1024 administrator (all of the others, and skips channel overrides).
      minimum: 0
      maximum: 2047

    Guild:
      type: object
      required: [id, name, ownerId, createdAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }

    GuildList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Guild' }

    CreateGuildRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    TransferOwnershipRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, description: Must be a member. }

    Member:
      type: object
      required: [user, joinedAt, roleIds]
      properties:
        user: { $ref: '#/components/schemas/User' }
        joinedAt: { type: string, format: date-time }
        roleIds:
          type: array
          description: Roles of the member, not counting the implicit @everyone.
          items: { type: string }

    MemberPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        total: { type: integer, description: 'Members of the guild, across all pages.' }
        next: { type: string, description: Absent on the last page. }

    Role:
      type: object
      required: [id, name, permissions, position, everyone]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions: { $ref: '#/components/schemas/Permissions' }
        position: { type: integer, minimum: 0, description: 'Higher = more power. @everyone is 0.' }
        everyone: { type: boolean }

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions: { $ref: '#/components/schemas/Permissions' }

    UpdateRoleRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        permissions: { $ref: '#/components/schemas/Permissions' }
        position: { type: integer, minimum: 1, description: 'Moves the role to this place among the non-@everyone roles; beyond the top means the top.' }

    Invite:
      type: object
      required: [code, guildId, creatorId, uses, createdAt]
      properties:
        code: { type: string }
        guildId: { type: string }
        creatorId: { type: string }
        maxUses: { type: integer, minimum: 1, description: Absent = unlimited. }
        uses: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time, description: Absent = never. }
        createdAt: { type: string, format: date-time }

    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invite' }

    CreateInviteRequest:
      type: object
      properties:
        maxUses: { type: integer, minimum: 1, maximum: 1000000 }
        expiresIn: { type: integer, minimum: 1, maximum: 31536000, description: Seconds from now. }

    InvitePreview:
      type: object
      required: [code, guild]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        guild: { $ref: '#/components/schemas/Guild' }

    BanRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 512 }

    Ban:
      type: object
      required: [user, bannedBy, reason, createdAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        bannedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    BanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ban' }

    # ---------- channels ----------
    ChannelKind:
      type: string
      enum: [text, voice, category]

    Channel:
      type: object
      required: [id, guildId, name, kind, position]
      properties:
        id: { type: string }
        guildId: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/ChannelKind' }
        parentId: { type: string, description: 'The category it sits in. Absent for categories and loose channels.' }
        position: { type: integer, minimum: 0, description: 'Order among channels with the same `parentId`.' }

    ChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Channel' }

    CreateChannelRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/ChannelKind' }
        parentId: { type: string, description: A category of the same guild. Not allowed for categories. }

    UpdateChannelRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: string, nullable: true, description: Absent = unchanged; null = out of any category. }
        position: { type: integer, minimum: 0, description: 'Place in the destination group; beyond the end means the end. Changing only `parentId` puts it at the end.' }

    OverrideRequest:
      type: object
      properties:
        allow: { $ref: '#/components/schemas/Permissions' }
        deny: { $ref: '#/components/schemas/Permissions' }

    Override:
      type: object
      required: [kind, targetId, allow, deny]
      properties:
        kind: { type: string, enum: [role, member] }
        targetId: { type: string }
        allow: { $ref: '#/components/schemas/Permissions' }
        deny: { $ref: '#/components/schemas/Permissions' }

    OverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Override' }

    # ---------- messages ----------
    Attachment:
      type: object
      required: [id, url, contentType]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        contentType: { type: string }
        name: { type: string }
        size: { type: integer }
        width: { type: integer, description: 'Pixels, for images and video.' }
        height: { type: integer }

    Message:
      type: object
      required: [id, channelId, author, createdAt, text, attachments, reactions]
      properties:
        id: { type: string }
        channelId: { type: string }
        author: { $ref: '#/components/schemas/User' }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, description: Present once the message was edited. }
        text: { type: string }
        replyToId: { type: string, description: The message this one answers. Absent when it is not a reply or the original was deleted. }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/Reaction' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        nonce: { type: string, description: "Echo of the sender's nonce, so the sender can match it with its optimistic copy. Only present on the sender's own message." }

    Reaction:
      type: object
      required: [emoji, count, me]
      properties:
        emoji: { type: string }
        count: { type: integer, minimum: 1 }
        me: { type: boolean, description: The caller reacted with this emoji. }

    MessagePage:
      type: object
      required: [items, hasMore, hasNewer]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        hasMore: { type: boolean, description: There are older messages than the first item. }
        hasNewer: { type: boolean, description: There are newer messages than the last item. }

    EditMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }

    ReadState:
      type: object
      required: [channelId, unread]
      properties:
        channelId: { type: string }
        lastReadMessageId: { type: string, description: Absent when the caller never read the channel. }
        unread: { type: integer, description: 'Messages newer than `lastReadMessageId` by other authors, capped at 1000.' }

    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 4000, description: May be empty only when `attachmentIds` is not (attachments arrive with that capability; until then it is required and non-blank). }
        replyToId: { type: string }
        nonce: { type: string, maxLength: 64 }
        attachmentIds:
          type: array
          items: { type: string }

    ReadRequest:
      type: object
      required: [messageId]
      properties:
        messageId: { type: string }

    # ---------- voice ----------
    VoiceParticipant:
      type: object
      required: [user, muted, camOn, sharing]
      properties:
        user: { $ref: '#/components/schemas/User' }
        muted: { type: boolean }
        camOn: { type: boolean }
        sharing: { type: boolean, description: Screen share on. }

    IceServer:
      type: object
      required: [urls]
      description: Same shape as WebRTC's RTCIceServer. TURN credentials should be short-lived.
      properties:
        urls:
          type: array
          items: { type: string }
        username: { type: string }
        credential: { type: string }

    VoiceSession:
      type: object
      required: [media, iceServers, participants]
      properties:
        media:
          type: object
          required: [url, token]
          properties:
            url: { type: string, format: uri, description: A ws:// or wss:// URL of the signaling socket. }
            token: { type: string, description: 'Short-lived, single use; what the client sends in the media `join` frame.' }
        iceServers:
          type: array
          items: { $ref: '#/components/schemas/IceServer' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/VoiceParticipant' }

    # ---------- gateway frames ----------
    GatewayClientMessage:
      oneOf:
        - $ref: '#/components/schemas/IdentifyOp'
        - $ref: '#/components/schemas/PresenceSetOp'
        - $ref: '#/components/schemas/VoiceStateSetOp'
      discriminator:
        propertyName: op
        mapping:
          identify: '#/components/schemas/IdentifyOp'
          presence.set: '#/components/schemas/PresenceSetOp'
          voice.state.set: '#/components/schemas/VoiceStateSetOp'

    IdentifyOp:
      type: object
      required: [op, d]
      properties:
        op: { type: string, enum: [identify] }
        d:
          type: object
          required: [token]
          properties:
            token: { type: string, description: The access token. }

    PresenceSetOp:
      type: object
      description: Sent when the user goes idle or comes back. Connecting implies online.
      required: [op, d]
      properties:
        op: { type: string, enum: [presence.set] }
        d:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [online, idle] }

    VoiceStateSetOp:
      type: object
      description: The caller's own mute, camera and screen-share state while connected to a voice channel. The server rebroadcasts it as `voice.state`.
      required: [op, d]
      properties:
        op: { type: string, enum: [voice.state.set] }
        d:
          type: object
          required: [muted, camOn, sharing]
          properties:
            muted: { type: boolean }
            camOn: { type: boolean }
            sharing: { type: boolean }

    GatewayServerMessage:
      oneOf:
        - $ref: '#/components/schemas/ReadyEvent'
        - $ref: '#/components/schemas/MessageCreateEvent'
        - $ref: '#/components/schemas/MemberUpdateEvent'
        - $ref: '#/components/schemas/MemberRemoveEvent'
        - $ref: '#/components/schemas/VoiceStateEvent'
        - $ref: '#/components/schemas/VoiceSpeakingEvent'
      discriminator:
        propertyName: op
        mapping:
          ready: '#/components/schemas/ReadyEvent'
          message.create: '#/components/schemas/MessageCreateEvent'
          member.update: '#/components/schemas/MemberUpdateEvent'
          member.remove: '#/components/schemas/MemberRemoveEvent'
          voice.state: '#/components/schemas/VoiceStateEvent'
          voice.speaking: '#/components/schemas/VoiceSpeakingEvent'

    ReadyEvent:
      type: object
      description: Reply to a valid `identify`. Events start flowing after it.
      required: [op, d]
      properties:
        op: { type: string, enum: [ready] }
        d:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    MessageCreateEvent:
      type: object
      description: A message in a channel the caller can read. The sender receives it too.
      required: [op, d]
      properties:
        op: { type: string, enum: [message.create] }
        d:
          type: object
          required: [message]
          properties:
            message: { $ref: '#/components/schemas/Message' }

    MemberUpdateEvent:
      type: object
      description: A member joined, or changed name, subtitle, avatar or status. Upsert by `user.id`.
      required: [op, d]
      properties:
        op: { type: string, enum: [member.update] }
        d:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    MemberRemoveEvent:
      type: object
      required: [op, d]
      properties:
        op: { type: string, enum: [member.remove] }
        d:
          type: object
          required: [userId]
          properties:
            userId: { type: string }

    VoiceStateEvent:
      type: object
      description: Someone joined or left a voice channel (`connected`), or changed mute, camera or screen share.
      required: [op, d]
      properties:
        op: { type: string, enum: [voice.state] }
        d:
          type: object
          required: [channelId, connected, participant]
          properties:
            channelId: { type: string }
            connected: { type: boolean }
            participant: { $ref: '#/components/schemas/VoiceParticipant' }

    VoiceSpeakingEvent:
      type: object
      description: Optional. Sent when someone starts or stops talking, for the speaking highlight. A client that never gets it just shows no highlight.
      required: [op, d]
      properties:
        op: { type: string, enum: [voice.speaking] }
        d:
          type: object
          required: [channelId, userId, speaking]
          properties:
            channelId: { type: string }
            userId: { type: string }
            speaking: { type: boolean }

    # ---------- media frames ----------
    MediaClientMessage:
      oneOf:
        - $ref: '#/components/schemas/MediaJoin'
        - $ref: '#/components/schemas/MediaPublish'
        - $ref: '#/components/schemas/MediaOffer'
        - $ref: '#/components/schemas/MediaAnswer'
        - $ref: '#/components/schemas/MediaCandidate'
      discriminator:
        propertyName: op
        mapping:
          join: '#/components/schemas/MediaJoin'
          publish: '#/components/schemas/MediaPublish'
          offer: '#/components/schemas/MediaOffer'
          answer: '#/components/schemas/MediaAnswer'
          candidate: '#/components/schemas/MediaCandidate'

    MediaServerMessage:
      oneOf:
        - $ref: '#/components/schemas/MediaJoined'
        - $ref: '#/components/schemas/MediaOffer'
        - $ref: '#/components/schemas/MediaAnswer'
        - $ref: '#/components/schemas/MediaCandidate'
        - $ref: '#/components/schemas/MediaError'
      discriminator:
        propertyName: op
        mapping:
          joined: '#/components/schemas/MediaJoined'
          offer: '#/components/schemas/MediaOffer'
          answer: '#/components/schemas/MediaAnswer'
          candidate: '#/components/schemas/MediaCandidate'
          error: '#/components/schemas/MediaError'

    MediaJoin:
      type: object
      description: First client frame. Closes with 4001 if the token is invalid, expired or already used.
      required: [op, d]
      properties:
        op: { type: string, enum: [join] }
        d:
          type: object
          required: [token]
          properties:
            token: { type: string, description: '`VoiceSession.media.token`.' }

    MediaJoined:
      type: object
      description: Reply to a valid `join`. Negotiation may start.
      required: [op, d]
      properties:
        op: { type: string, enum: [joined] }
        d: { type: object }

    MediaPublish:
      type: object
      description: Declares what a local track is. Sent before the `offer` that carries it.
      required: [op, d]
      properties:
        op: { type: string, enum: [publish] }
        d:
          type: object
          required: [trackId, source]
          properties:
            trackId: { type: string, description: The local track's id (the `a=msid` track id in the SDP). }
            source: { type: string, enum: [mic, camera, screen, screenAudio] }

    MediaOffer:
      type: object
      description: Either side. Single PeerConnection, renegotiated whenever tracks are added or removed. The client is the polite peer.
      required: [op, d]
      properties:
        op: { type: string, enum: [offer] }
        d:
          type: object
          required: [sdp]
          properties:
            sdp: { type: string }

    MediaAnswer:
      type: object
      required: [op, d]
      properties:
        op: { type: string, enum: [answer] }
        d:
          type: object
          required: [sdp]
          properties:
            sdp: { type: string }

    MediaCandidate:
      type: object
      description: Trickle ICE, both directions. Same fields as RTCIceCandidateInit. Empty `candidate` = end of candidates.
      required: [op, d]
      properties:
        op: { type: string, enum: [candidate] }
        d:
          type: object
          required: [candidate]
          properties:
            candidate: { type: string }
            sdpMid: { type: string }
            sdpMLineIndex: { type: integer }

    MediaError:
      type: object
      description: Sent just before the server closes the socket.
      required: [op, d]
      properties:
        op: { type: string, enum: [error] }
        d:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
