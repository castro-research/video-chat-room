services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      # API + WebSocket
      - "7880:7880"            
      # WebRTC TCP
      - "7881:7881"            
      # WebRTC UDP
      - "7882:7882/udp"        
    restart: unless-stopped

  meet:
    image: node:22
    working_dir: /app
    environment:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq git-lfs && git lfs install &&
             git clone --depth 1 https://github.com/livekit-examples/meet.git . &&
             corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - livekit
