services:
  # Visualização do contrato (contract/openapi.yaml) em http://localhost:8081. Recarregar a página relê o ficheiro.
  api-docs:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./contract:/spec:ro
