services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kurz
      POSTGRES_PASSWORD: kurz
      POSTGRES_DB: kurz
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurz"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kurzdb:/var/lib/postgresql/data
  # S3 local para os anexos. A imagem oficial minio/minio saiu do Docker Hub; usamos a do Chainguard (distroless,
  # sem shell: por isso não há healthcheck aqui, `make s3-up` espera pelo endpoint de saúde).
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kurzdev
      MINIO_ROOT_PASSWORD: kurzdev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kurzs3:/data
volumes:
  kurzdb:
  kurzs3:
