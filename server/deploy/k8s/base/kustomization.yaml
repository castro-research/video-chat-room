apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kurz
resources:
  - namespace.yaml
  - postgres.yaml
  - seaweedfs.yaml
  - kurz.yaml
configMapGenerator:
  - name: kurz-config
    literals:
      - KURZ_ADDR=:8080
      - KURZ_METRICS_ADDR=:9090
      - KURZ_NODE_ID_FROM_HOSTNAME=true
      - KURZ_SERVER_NAME=Kurz
      - KURZ_REGISTRATION=open
      - KURZ_RATELIMIT=on
      - KURZ_S3_ENDPOINT=seaweedfs.kurz.svc:8333
      - KURZ_S3_BUCKET=kurz
