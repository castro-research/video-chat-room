apiVersion: v1
kind: Secret
metadata:
  name: kurz-secrets
  namespace: kurz
type: Opaque
stringData:
  # SEGREDOS DE DESENVOLVIMENTO. Não são reais. KURZ_JWT_SECRET exige 32 bytes ou mais; o mesmo valor em todas as réplicas.
  KURZ_JWT_SECRET: "DEV-ONLY-jwt-secret-change-me-0123456789abcdef"
  KURZ_DATABASE_URL: "postgres://kurz:kurz-dev-only@postgres.kurz.svc:5432/kurz?sslmode=disable"
  KURZ_S3_ACCESS_KEY: kurzdev
  KURZ_S3_SECRET_KEY: kurzdev-secret
---
# Headless: dá nome estável (kurz-0, kurz-1...) aos pods do StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: kurz-headless
  namespace: kurz
spec:
  clusterIP: None
  selector: { app: kurz }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: kurz
  namespace: kurz
  labels: { app: kurz }
spec:
  selector: { app: kurz }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kurz
  namespace: kurz
spec:
  serviceName: kurz-headless
  replicas: 2
  # Sem ordem: as réplicas sobem juntas (a migração é serializada por advisory lock) e uma morta volta sem esperar as outras.
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: kurz }
  template:
    metadata:
      labels: { app: kurz }
      annotations:
        # /metrics é INTERNO: sem auth e fora do rate limit. Nunca o roteie num Ingress público.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kurz
          image: kurz/server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: kurz-config }
            - secretRef: { name: kurz-secrets }
          # KURZ_NODE_ID_FROM_HOSTNAME=true (no ConfigMap) deriva o node id do ordinal do pod (kurz-0 -> 0, kurz-1 -> 1):
          # único por réplica e estável quando o pod é recriado.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # /healthz pinga o banco; a tolerância alta evita reiniciar todas as réplicas por um soluço do Postgres.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
# Nunca derruba as duas réplicas de propósito (drain de nó).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kurz
  namespace: kurz
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: kurz }
