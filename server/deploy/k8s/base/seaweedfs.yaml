# SeaweedFS (S3) para ESTUDO (anexos). O bucket é criado pelo próprio servidor na subida.
apiVersion: v1
kind: Secret
metadata:
  name: kurz-seaweedfs-s3
  namespace: kurz
type: Opaque
stringData:
  # DEV-ONLY: identity de desenvolvimento (Admin, para o servidor criar o bucket). Não são segredos reais.
  s3.json: |
    {
      "identities": [
        {
          "name": "kurzdev",
          "credentials": [{ "accessKey": "kurzdev", "secretKey": "kurzdev-secret" }],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: kurz
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: kurz
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=50", "-master.volumeSizeLimitMB=128"]
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: data
          emptyDir: {} # estudo: os anexos somem com o pod
        - name: s3-config
          secret: { secretName: kurz-seaweedfs-s3 }
