# Para o cluster kind: publica a API (localhost:28080) e o S3 do SeaweedFS (localhost:29000) por NodePort.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: kurz-config
    behavior: merge
    literals:
      # as URLs pré-assinadas precisam do host que o CLIENTE alcança (a assinatura cobre o host)
      - KURZ_S3_PUBLIC_ENDPOINT=localhost:29000
patches:
  - target: { kind: Service, name: kurz }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30080 }
  - target: { kind: Service, name: seaweedfs }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30900 }
