services:
  kurz:
    image: ${KURZ_IMAGE:?defina KURZ_IMAGE}
    environment:
      KURZ_DATABASE_URL: postgres://kurz:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/kurz?sslmode=disable
      KURZ_JWT_SECRET: ${KURZ_JWT_SECRET:?defina KURZ_JWT_SECRET}
      KURZ_NODE_ID: "0"
      KURZ_S3_ENDPOINT: seaweedfs:8333
      KURZ_S3_PUBLIC_ENDPOINT: ${KURZ_S3_PUBLIC_ENDPOINT:?defina KURZ_S3_PUBLIC_ENDPOINT}
      KURZ_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY}
      KURZ_S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
      KURZ_SECRET: ${KURZ_SECRET:?defina KURZ_SECRET}
      KURZ_SFU_URL: ${KURZ_SFU_URL:?defina KURZ_SFU_URL}
      KURZ_TRUSTED_PROXY: ${KURZ_TRUSTED_PROXY:?defina KURZ_TRUSTED_PROXY}
      KURZ_METRICS_ADDR: ":9090"
    ports:
      - "30082:8080"
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 3s }

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: kurz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: kurz
    volumes:
      - { type: bind, source: "${KURZ_DATA_DIR:?defina KURZ_DATA_DIR}/postgres", target: /var/lib/postgresql }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurz"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.ip.bind=0.0.0.0", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=50", "-master.volumeSizeLimitMB=128"]
    ports:
      - "30083:8333"
    volumes:
      - { type: bind, source: "${KURZ_DATA_DIR:?defina KURZ_DATA_DIR}/seaweedfs", target: /data }
    configs:
      - source: s3json
        target: /etc/seaweedfs/s3.json

configs:
  s3json:
    name: ${S3_CONFIG_NAME:?defina S3_CONFIG_NAME}
    file: ./.s3.json
