name: iosApp
options:
  bundleIdPrefix: app.kurz
  postGenCommand: pod install  # o xcodegen reescreve o .xcodeproj e apaga a integração dos Pods (WebRTC fica sem link)
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Kurz Community
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Para chamadas de vídeo/voz na sala.
        NSMicrophoneUsageDescription: Para chamadas de vídeo/voz na sala.
        NSLocalNetworkUsageDescription: Para ligar ao servidor de chamadas na rede local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true  # manager http:// e SFU ws:// só em IPs/hosts da LAN; fora da LAN é preciso https/wss
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kurz.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64  # os alvos Kotlin são só iosArm64/iosSimulatorArm64: sem simulador x86_64
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework KurzShared"
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode não herda o JAVA_HOME do shell: usa um JDK 17-21 do sistema
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home -v 17)
          fi
          cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  iosApp-Release:
    build:
      targets:
        iosApp: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
